name: Seed Macro Events

on:
    workflow_dispatch:
        inputs:
            year:
                description: "Year to seed (defaults to current year)"
                required: false
                type: string

jobs:
    seed:
        runs-on: ubuntu-latest
        steps:
            - name: Seed macro events
              env:
                  APP_URL: ${{ secrets.APP_URL }}
                  CRON_SECRET: ${{ secrets.CRON_SECRET }}
              run: |
                  YEAR="${{ github.event.inputs.year }}"
                  if [ -z "$YEAR" ]; then
                    YEAR=$(date +%Y)
                  fi
                  echo "Seeding macro events for year: $YEAR"
                  curl -sf -X POST \
                    "${APP_URL}/api/events/seed-macro?year=${YEAR}" \
                    -H "Authorization: Bearer ${CRON_SECRET}" \
                    -H "Content-Type: application/json" \
                    --max-time 30 | jq .
